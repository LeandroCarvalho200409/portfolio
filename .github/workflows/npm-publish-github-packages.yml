name: Manual Build and Deploy from Release Branch

on:
  workflow_dispatch: # Ativa o botão de disparo manual no painel do GitHub

permissions:
  contents: write # Permite que a Action envie o build para a branch gh-pages

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        # O checkout usará automaticamente a branch que você selecionar no painel

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      - name: Deploy to GitHub Pages Branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: ./dist # Altere para ./build se usar Create React App
          branch: gh-pages # O GitHub Pages vai ler os arquivos estáticos finais daqui
          commit-message: "Manual Deploy: Build gerado a partir da branch ${{ github.ref_name }}"
          clean: true

